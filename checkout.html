<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thanh toán | VTA SYSTEMS</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0b0b0b;
color:#fff;
}

header{
height:75px;
background:#111;
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
font-weight:bold;
border-bottom:2px solid #222;
}

header span{
color:#ff6600;
}

.container{
max-width:700px;
margin:40px auto;
background:#151515;
padding:35px;
border-radius:15px;
border:1px solid #222;
}

h1{
text-align:center;
margin-bottom:30px;
}

input,
textarea,
select{

width:100%;
padding:14px;
margin:12px 0;
background:#0f0f0f;
color:white;
border:1px solid #333;
border-radius:8px;
font-size:16px;

}

textarea{
resize:none;
height:100px;
}

.total{

background:#111;
padding:18px;
border-radius:10px;
margin:20px 0;
font-size:22px;
font-weight:bold;
color:#ff6600;
text-align:center;

}

button{

width:100%;
padding:16px;
background:#ff6600;
color:white;
border:none;
border-radius:8px;
font-size:18px;
font-weight:bold;
cursor:pointer;

}

button:hover{

background:#ff7b26;

}

.back{

display:block;
margin-top:20px;
text-align:center;
color:#ccc;
text-decoration:none;

}

/* THÊM NGAY DƯỚI ĐÂY */

.privacy-note{
    font-family:'Montserrat',sans-serif;
    font-size:14px;
    font-weight:300;
    color:#9a9a9a;
    line-height:1.8;
    margin:30px 0;
}

@media(max-width:768px){

.privacy-note{
    font-size:13px;
    line-height:1.7;
}

}

</style>

</head>

<body>

<header>

VTA <span> SYSTEMS</span>

</header>

<div class="container">

<div class="checkout-grid">

<div class="shipping">
  
<h1>THÔNG TIN GIAO HÀNG</h1>

<div class="row">

<input id="lastName" type="text" placeholder="Họ">

<input id="firstName" type="text" placeholder="Tên">

</div>

<input id="phone" type="text" placeholder="Số điện thoại">

<input id="email" type="email" placeholder="Email">

<input id="address" type="text" placeholder="Địa chỉ nhận hàng">

<input id="district" type="text" placeholder="Quận / Huyện">
  
<input id="city" type="text" placeholder="Tỉnh / Thành phố">

<textarea id="note" placeholder="Ghi chú (không bắt buộc)"></textarea>

<p class="privacy-note">
Thông tin cá nhân của bạn sẽ được sử dụng để xử lý đơn hàng, tăng trải nghiệm sử dụng website, và cho các mục đích cụ thể khác đã được mô tả trong Chính sách bảo mật.
</p>

<input id="coupon" type="text" placeholder="Mã ưu đãi">


  <input id="coupon" type="text" placeholder="Mã ưu đãi">

<select id="payment">
<option>Thanh toán khi nhận hàng (COD)</option>
<option>Chuyển khoản ngân hàng</option>
</select>

<label style="display:flex;align-items:center;gap:10px;margin:25px 0;">
<input type="checkbox" id="agree">
Tôi đồng ý với điều khoản và chính sách bảo mật.
</la
  
<div class="total">

Tổng thanh toán:
<strong id="totalPrice">0đ</strong>

</div>

<button onclick="placeOrder()">
ĐẶT HÀNG
</button>

<a class="back" href="cart.html">
← Quay lại giỏ hàng
</a>

</div> <!-- shipping -->

</div> <!-- checkout-grid -->

</div> <!-- container -->

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let total = 0;

cart.forEach(item=>{

total += item.price * item.quantity;

});

document.getElementById("totalPrice").innerHTML =
total.toLocaleString("vi-VN")+"đ";

function placeOrder(){

let name=document.getElementById("name").value.trim();

let phone=document.getElementById("phone").value.trim();

let email=document.getElementById("email").value.trim();

let address=document.getElementById("address").value.trim();

if(name==""||phone==""||email==""||address==""){

alert("Vui lòng nhập đầy đủ thông tin!");

return;

}

if(!document.getElementById("agree").checked){

alert("Bạn cần đồng ý điều khoản.");

return;

}
  
alert("Đặt hàng thành công!\nVTA SYSTEMS sẽ sớm liên hệ xác nhận đơn hàng.");

localStorage.removeItem("cart");

window.location.href="index.html";

}

</script>

</body>
</html>
