<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sản Phẩm | VTA SYSTEMS</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}


body{
background:#0b0b0b;
color:white;
}


/* HEADER */

header{

height:75px;
background:#111;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 50px;

border-bottom:2px solid #222;

}


.logo{

font-size:28px;
font-weight:900;

}


.logo span{

color:#ff6600;

}


nav a{

color:white;
text-decoration:none;
margin-left:25px;
font-weight:bold;

}


nav a:hover{

color:#ff6600;

}


/* TITLE */

.title{

text-align:center;
padding:70px 20px;

}


.title h1{

font-size:45px;
font-weight:900;

}


.title span{

color:#ff6600;

}


.title p{

color:#aaa;
margin-top:15px;
font-size:18px;

}



/* PRODUCT */

.product-container{

max-width:1200px;

margin:auto;

padding:40px;

display:grid;

grid-template-columns:repeat(auto-fit,minmax(300px,1fr));

gap:40px;

}



.product-card{

background:#151515;

border:1px solid #222;

border-radius:15px;

padding:25px;

text-align:center;

transition:.3s;

}



.product-card:hover{

transform:translateY(-8px);

border-color:#ff6600;

box-shadow:0 10px 30px rgba(255,102,0,.25);

}



.product-card img{

width:100%;

height:260px;

object-fit:contain;

background:#080808;

border-radius:10px;

margin-bottom:20px;

}



.brand{

color:#777;

font-size:13px;

letter-spacing:2px;

}



.product-card h2{

font-size:28px;

margin:10px 0;

}



.price{

color:#ff6600;

font-size:22px;

font-weight:bold;

margin:15px;

}



.button{

display:inline-block;

padding:12px 20px;

margin:5px;

background:#ff6600;

color:white;

text-decoration:none;

border-radius:7px;

font-weight:bold;

border:none;

cursor:pointer;

}



.button:hover{

background:#ff8533;

}



footer{

margin-top:80px;

padding:30px;

text-align:center;

background:#080808;

color:#888;

}



.cart-icon{

position:relative;

}


#cart-count{

position:absolute;

top:-15px;

right:-15px;

background:#ff6600;

width:20px;

height:20px;

border-radius:50%;

font-size:12px;

display:flex;

align-items:center;

justify-content:center;

}



</style>

</head>


<body>


<header>


<div class="logo">

VTA <span><i class="fa-solid fa-bolt"></i></span> SYSTEMS

</div>



<nav>

<a href="index.html">
Trang chủ
</a>


<a href="series.html">
🎵 Dòng loa
</a>


<a href="cart.html" class="cart-icon">

<i class="fa-solid fa-cart-shopping"></i>

<span id="cart-count">0</span>

</a>


</nav>


</header>




<section class="title">

<h1>

🛒 SẢN PHẨM <span>VTA SYSTEMS</span>

</h1>


<p>

Toàn bộ sản phẩm loa đang được bán trên website

</p>


</section>





<section class="product-container">



<div class="product-card">


<img src="dravox-one.png">


<div class="brand">
VTA SYSTEMS
</div>


<h2>

</h2>


<div class="price">
2.340.000 VNĐ
</div>


<a class="button" href="products/dravox.html">
Chi tiết
</a>

onclick="addToCart('DRAVOX One',2340000,'dravox-one.png')">

</button>


</div>





<div class="product-card">


<img src="leviathan-x4.jpg">


<div class="brand">
VTA SYSTEMS
</div>


<h2>
LEVIATHAN X4
</h2>


<div class="price">
16.870.000 VNĐ
</div>


<a class="button" href="products/leviathan-x4.html">
Chi tiết
</a>


<button class="button"
onclick="addToCart('LEVIATHAN X4',16870000,'leviathan-x4.jpg')">

🛒 Thêm vào giỏ

</button>


</div>





<div class="product-card">

</div>


<h2>

</section>





<footer>

© 2026 VTA SYSTEMS

</footer>




<script>


function addToCart(name,price,image){

let cart=JSON.parse(localStorage.getItem("cart"))||[];


let product=cart.find(item=>item.name===name);


if(product){

product.qty++;

}else{


cart.push({

name:name,
price:price,
image:image,
qty:1

});


}


localStorage.setItem("cart",JSON.stringify(cart));


updateCart();


alert("Đã thêm vào giỏ hàng!");

}



function updateCart(){

let cart=JSON.parse(localStorage.getItem("cart"))||[];

let count=0;


cart.forEach(item=>{

count+=item.qty;

});


document.getElementById("cart-count").innerHTML=count;


}


updateCart();


</script>



</body>
</html>
