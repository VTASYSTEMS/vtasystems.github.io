<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dòng VORTEX | VTA SYSTEMS</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0b0b0b;
color:white;
}

header{
height:75px;
background:#111;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 50px;
border-bottom:2px solid #222;
}

.logo{
font-size:28px;
font-weight:900;
}

.logo span{
color:#ff6600;
}

nav a{
color:white;
text-decoration:none;
margin-left:25px;
font-weight:bold;
}

nav a:hover{
color:#ff6600;
}

.title{
text-align:center;
padding:60px 20px;
}

.title h1{
font-size:42px;
}

.title span{
color:#ff6600;
}

.products{
max-width:1200px;
margin:auto;
padding:40px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:35px;
}

.card{
background:#151515;
border:1px solid #222;
border-radius:15px;
padding:20px;
text-align:center;
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
border-color:#ff6600;
}

.card img{
width:100%;
height:250px;
object-fit:contain;
background:#0b0b0b;
border-radius:10px;
margin-bottom:15px;
}

.card h2{
margin-bottom:10px;
}

.price{
font-size:24px;
color:#ff6600;
font-weight:bold;
margin-bottom:15px;
}

.button{
display:inline-block;
padding:12px 25px;
margin:5px;
background:#ff6600;
color:white;
text-decoration:none;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.button:hover{
background:#ff8533;
}

footer{
margin-top:60px;
padding:30px;
background:#080808;
text-align:center;
}

</style>

</head>

<body>

<header>

<div class="logo">
VTA <span><i class="fa-solid fa-bolt"></i></span> SYSTEMS
</div>

<nav>

<a href="index.html">Trang chủ</a>

<a href="series.html">Dòng loa</a>

<a href="cart.html">
<i class="fa-solid fa-cart-shopping"></i>
Giỏ hàng
</a>

</nav>

</header>

<section class="title">

<h1>Dòng <span>VORTEX</span></h1>

<p>Các mẫu loa thuộc dòng VORTEX</p>

</section>

<section class="products">

<div class="card">

<img src="vortex-x3.jpg" alt="VORTEX X3">

<h2>VORTEX X3</h2>

<div class="price">
6.990.000đ
</div>

<a class="button" href="products/vortex.html">
Chi tiết
</a>

<button class="button"
onclick="addToCart(
'VORTEX X3',
6990000,
'vortex-x3.jpg'
)">
🛒 Thêm vào giỏ
</button>

</div>

</section>

<footer>

© 2026 VTA SYSTEMS

</footer>

<script>

function addToCart(name,price,image){

let cart=JSON.parse(localStorage.getItem("cart"))||[];

let product=cart.find(item=>item.name===name);

if(product){

product.qty++;

}else{

cart.push({
name:name,
price:price,
image:image,
qty:1
});

}

localStorage.setItem("cart",JSON.stringify(cart));

alert("Đã thêm vào giỏ hàng!");

}

</script>

</body>
</html>
