<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tài khoản | VTA SYSTEMS</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0b0b0b;
color:white;
}

header{

height:75px;
background:#111;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 40px;
border-bottom:2px solid #222;

}

.logo{

font-size:30px;
font-weight:bold;

}

.logo span{

color:#ff6600;

}

header a{

color:white;
text-decoration:none;
font-weight:bold;

}

.container{

max-width:1200px;
margin:40px auto;
padding:20px;
display:flex;
gap:30px;

}

.sidebar{

width:280px;
background:#151515;
border-radius:12px;
padding:20px;

}

.sidebar h2{

margin-bottom:20px;
color:#ff6600;

}

.menu a{

display:block;
padding:15px;
margin-bottom:10px;
background:#202020;
border-radius:8px;
color:white;
text-decoration:none;
transition:.3s;

}

.menu a:hover{

background:#ff6600;

}

.content{

flex:1;
background:#151515;
border-radius:12px;
padding:30px;

}

.content h2{

margin-bottom:20px;
color:#ff6600;

}

.card{

background:#202020;
padding:20px;
border-radius:10px;
margin-bottom:20px;

}

.card h3{

margin-bottom:15px;

}

.info{

line-height:2;

}

.logout{

background:#d63031 !important;

}

@media(max-width:768px){

.container{

flex-direction:column;

}

.sidebar{

width:100%;

}

}

</style>

</head>

<body>

<header>

<div class="logo">

VTA <span><i class="fa-solid fa-bolt"></i></span> SYSTEMS

</div>

<a href="index.html">

<i class="fa-solid fa-house"></i>

Trang chủ

</a>

</header>

<div class="container">

<div class="sidebar">

<h2>👤 TÀI KHOẢN</h2>

<div class="menu">

<a href="#">📦 Đơn hàng</a>

<a href="#">🎁 Mã ưu đãi</a>

<a href="#">⚙️ Thông tin cá nhân</a>

<a href="#" class="logout">🚪 Đăng xuất</a>

</div>

</div>

<div class="content">

<h2>Xin chào!</h2>

<div class="card">

<h3>👤 Thông tin tài khoản</h3>

<div class="info">

Họ tên:
<strong id="name">Chưa đăng nhập</strong>

<br>

Email:
<strong id="email">...</strong>

<br>

Số điện thoại:
<strong id="phone">...</strong>

</div>

</div>

<div class="card">

<h3>📦 Đơn hàng gần đây</h3>

<p>

Bạn chưa có đơn hàng nào.

</p>

</div>

<div class="card">

<h3>🎁 Mã ưu đãi</h3>

<p>

Bạn hiện chưa có mã ưu đãi.

</p>

</div>

</div>

</div>

<script type="module">

import { auth, database } from "./firebase.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    ref,
    get
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

onAuthStateChanged(auth, async (user) => {

    if (!user) {
        window.location.href = "login.html";
        return;
    }

    try {

        const snapshot = await get(ref(database, "users/" + user.uid));

        if (snapshot.exists()) {

            const data = snapshot.val();

            document.getElementById("name").textContent =
                data.username || (data.lastName + " " + data.firstName);

            document.getElementById("email").textContent =
                data.email || user.email;

            document.getElementById("phone").textContent =
                data.phone || "Chưa cập nhật";

        }

    } catch (error) {

        console.error(error);

    }

});

document.querySelector(".logout").addEventListener("click", async (e) => {

    e.preventDefault();

    await signOut(auth);

    alert("Đã đăng xuất!");

    window.location.href = "login.html";

});

</script>

  
</body>
</html>
