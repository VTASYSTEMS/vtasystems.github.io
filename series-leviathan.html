<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dòng LEVIATHAN | VTA SYSTEMS</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0b0b0b;
color:#fff;
}

/* HEADER */

header{
height:75px;
background:#111;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 50px;
border-bottom:2px solid #222;
}

.logo{
font-size:28px;
font-weight:900;
}

.logo span{
color:#ff6600;
}

nav a{
color:#fff;
text-decoration:none;
margin-left:25px;
font-weight:bold;
}

nav a:hover{
color:#ff6600;
}

/* TITLE */

.title{
text-align:center;
padding:70px 20px;
}

.title h1{
font-size:46px;
}

.title span{
color:#ff6600;
}

.title p{
margin-top:15px;
color:#aaa;
}

/* GRID */

.product-grid{

max-width:1200px;
margin:auto;

padding:20px 40px 70px;

display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:40px;

}

.product-card{

background:#151515;
border:1px solid #222;
border-radius:15px;
padding:20px;

transition:.3s;

}

.product-card:hover{

transform:translateY(-8px);

border-color:#ff6600;

box-shadow:0 10px 25px rgba(255,102,0,.25);

}

.product-slider{

display:flex;
overflow-x:auto;
scroll-snap-type:x mandatory;

scrollbar-width:none;

}

.product-slider::-webkit-scrollbar{

display:none;

}

.product-slider img{

flex:0 0 100%;
width:100%;
height:260px;
object-fit:contain;

scroll-snap-align:start;

}

h2{

margin:20px 0 10px;

}

.price{

color:#ff6600;

font-size:28px;

font-weight:bold;

margin-bottom:15px;

}

.spec{

color:#bbb;
line-height:1.7;
margin-bottom:25px;

}

.buttons{

display:flex;
gap:10px;
flex-wrap:wrap;

}

.button{

flex:1;

text-align:center;

padding:12px;

background:#ff6600;

color:#fff;

text-decoration:none;

border:none;

border-radius:8px;

font-weight:bold;

cursor:pointer;

}

.button:hover{

background:#ff8533;

}

footer{

background:#080808;

text-align:center;

padding:30px;

margin-top:50px;

}

</style>

</head>

<body>

<header>

<div class="logo">

VTA <span><i class="fa-solid fa-bolt"></i></span> SYSTEMS

</div>

<nav>

<a href="index.html">Trang chủ</a>

<a href="series.html">Dòng loa</a>

<a href="cart.html">Giỏ hàng</a>

</nav>

</header>

<section class="title">

<h1>Dòng <span>LEVIATHAN</span></h1>

<p>Các mẫu loa thuộc dòng LEVIATHAN của VTA Systems</p>

</section>

<div class="product-grid">

<div class="product-card">

<div class="product-slider">

<img src="leviathan-x4.jpg">

<img src="leviathan-1.jpg">

<img src="leviathan-2.jpg">

<img src="leviathan-3.jpg">

</div>

<h2>LEVIATHAN X4</h2>

<div class="price">

16.870.000đ

</div>

<div class="spec">

1500W<br>

2 Sub 6.5 inch<br>

TPA3255<br>

LED ARGB

</div>

<div class="buttons">

<a class="button"

href="products/leviathan-x4.html">

Chi tiết

</a>

<a class="button"

href="cart.html">

Mua ngay

</a>

<button

class="button"

onclick="addToCart('LEVIATHAN X4',16870000,'leviathan-x4.jpg')">

🛒

</button>

</div>

</div>

</div>

<footer>

© 2026 VTA SYSTEMS

</footer>

<script>

function addToCart(name,price,image){

let cart=JSON.parse(localStorage.getItem("cart"))||[];

let product=cart.find(i=>i.name==name);

if(product){

product.qty++;

}else{

cart.push({

name,

price,

image,

qty:1

});

}

localStorage.setItem("cart",JSON.stringify(cart));

alert("Đã thêm vào giỏ hàng!");

}

</script>

</body>
</html>
