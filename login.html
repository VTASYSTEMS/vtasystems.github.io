<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Đăng nhập | VTA SYSTEMS</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0b0b0b;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.login-box{

width:420px;
max-width:95%;
background:#151515;
padding:40px;
border-radius:15px;
border:1px solid #333;
box-shadow:0 0 20px rgba(0,0,0,.4);

}

.logo{

text-align:center;
font-size:32px;
font-weight:bold;
margin-bottom:10px;

}

.logo span{

color:#ff6600;

}

.subtitle{

text-align:center;
color:#bbb;
margin-bottom:35px;

}

.input-group{

margin-bottom:20px;

}

.input-group label{

display:block;
margin-bottom:8px;
font-weight:bold;

}

.input-group input{

width:100%;
padding:14px;
border:none;
border-radius:8px;
background:#222;
color:white;
font-size:16px;

}

.input-group input:focus{

outline:2px solid #ff6600;

}

button{

width:100%;
padding:16px;
border:none;
border-radius:8px;
background:#ff6600;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;

}

button:hover{

background:#ff7d26;

}

.links{

margin-top:25px;
text-align:center;

}

.links a{

color:#ff6600;
text-decoration:none;

}

.links a:hover{

text-decoration:underline;

}

.back{

margin-top:25px;
text-align:center;

}

.back a{

color:#aaa;
text-decoration:none;

}

.back a:hover{

color:#fff;

}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">
VTA <span><i class="fa-solid fa-bolt"></i></span> SYSTEMS
</div>

<div class="subtitle">
Đăng nhập để quản lý đơn hàng và nhận ưu đãi.
</div>

<form id="loginForm">

<div class="input-group">
<label>Email</label>
<input
type="email"
id="email"
placeholder="Nhập email của bạn"
required>
</div>

<div class="input-group">
<label>Mật khẩu</label>
<input
type="password"
id="password"
placeholder="Nhập mật khẩu"
required>
</div>

<button type="submit">

<i class="fa-solid fa-right-to-bracket"></i>

ĐĂNG NHẬP

</button>

</form>

<div class="links">

Chưa có tài khoản?

<a href="register.html">

Đăng ký ngay

</a>

</div>

<div class="back">

<a href="index.html">

← Quay về trang chủ

</a>

</div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit",function(e){

e.preventDefault();

alert("Bước tiếp theo sẽ kết nối Firebase để đăng nhập.");

});

</script>

</body>
</html>
