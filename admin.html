<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VTA SYSTEMS ADMIN</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
display:flex;
background:#f4f6fb;
}

.sidebar{

width:250px;
height:100vh;

background:#111827;

color:white;

padding:20px;

position:fixed;

left:0;

top:0;

}

.sidebar h2{

text-align:center;

margin-bottom:40px;

}

.sidebar a{

display:block;

padding:15px;

margin-bottom:10px;

text-decoration:none;

color:white;

border-radius:8px;

transition:.3s;

}

.sidebar a:hover{

background:#2563eb;

}

.main{

margin-left:250px;

padding:30px;

width:100%;

}

.cards{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:20px;

margin-bottom:30px;

}

.card{

background:white;

padding:20px;

border-radius:15px;

box-shadow:0 5px 15px rgba(0,0,0,.08);

}

.card h3{

font-size:18px;

margin-bottom:10px;

}

.card span{

font-size:30px;

font-weight:bold;

color:#2563eb;

}

.section{

background:white;

padding:25px;

border-radius:15px;

box-shadow:0 5px 15px rgba(0,0,0,.08);

margin-bottom:30px;

}

input,textarea{

width:100%;

padding:12px;

margin-top:10px;

margin-bottom:20px;

border:1px solid #ddd;

border-radius:8px;

}

button{

padding:12px 25px;

border:none;

background:#2563eb;

color:white;

border-radius:8px;

cursor:pointer;

font-size:16px;

}

button:hover{

background:#1d4ed8;

}

table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}

table th,table td{

padding:15px;

border-bottom:1px solid #eee;

text-align:left;

}

</style>

</head>

<body>
  
<div class="sidebar">

<h2>VTA SYSTEMS</h2>

<a href="#">🏠 Dashboard</a>

<a href="#">🛒 Sản phẩm</a>

<a href="#">📦 Đơn hàng</a>

<a href="#">👥 Khách hàng</a>

<a href="#">📊 Thống kê</a>

<a href="#">🚪 Đăng xuất</a>

</div>

<div class="main">

<h1>Dashboard</h1>

<br>

<div class="cards">

<div class="card">

<h3>Sản phẩm</h3>

<span id="productCount">0</span>

</div>

<div class="card">

<h3>Đơn hàng</h3>

<span id="orderCount">0</span>

</div>

<div class="card">

<h3>Khách hàng</h3>

<span id="customerCount">0</span>

</div>

<div class="card">

<h3>Doanh thu</h3>

<span id="revenue">0đ</span>

</div>

</div>

 </div>

<script type="module">

import { auth, database } from "./firebase.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    ref,
    get
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


// ===============================
// KIỂM TRA ĐĂNG NHẬP
// ===============================

onAuthStateChanged(auth, async (user) => {

    if (!user) {

        window.location.href = "login.html";

        return;

    }

    console.log("Admin đang đăng nhập:", user.email);

    loadDashboard();

});


// ===============================
// DASHBOARD
// ===============================

async function loadDashboard() {

    try {

        // -------------------------
        // ĐẾM SẢN PHẨM
        // -------------------------

        const productsSnapshot =
            await get(ref(database, "products"));

        let productCount = 0;

        if (productsSnapshot.exists()) {

            productCount =
                Object.keys(productsSnapshot.val()).length;

        }

        document.getElementById("productCount").textContent =
            productCount;


        // -------------------------
        // ĐẾM KHÁCH HÀNG
        // -------------------------

        const usersSnapshot =
            await get(ref(database, "users"));

        let customerCount = 0;

        if (usersSnapshot.exists()) {

            customerCount =
                Object.keys(usersSnapshot.val()).length;

        }

        document.getElementById("customerCount").textContent =
            customerCount;


        // -------------------------
        // ĐẾM ĐƠN HÀNG
        // -------------------------

        const ordersSnapshot =
            await get(ref(database, "orders"));

        let orderCount = 0;

        let revenue = 0;

        if (ordersSnapshot.exists()) {

            const orders =
                ordersSnapshot.val();

            orderCount =
                Object.keys(orders).length;


            // TÍNH DOANH THU

            Object.values(orders).forEach(order => {

                let total =
                    Number(order.total || 0);

                revenue += total;

            });

        }


        document.getElementById("orderCount").textContent =
            orderCount;


        // -------------------------
        // HIỂN THỊ DOANH THU
        // -------------------------

        document.getElementById("revenue").textContent =
            revenue.toLocaleString("vi-VN") + "đ";


    } catch (error) {

        console.error(
            "Không thể tải Dashboard:",
            error
        );

    }

}


// ===============================
// ĐĂNG XUẤT
// ===============================

const logoutButton =
    document.querySelector(".sidebar a:last-child");


logoutButton.addEventListener("click", async (event) => {

    event.preventDefault();

    try {

        await signOut(auth);

        window.location.href =
            "login.html";

    } catch (error) {

        console.error(
            "Lỗi đăng xuất:",
            error
        );

    }

});

</script>
  
</body>

</html>
