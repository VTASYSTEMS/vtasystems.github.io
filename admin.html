<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VTA SYSTEMS ADMIN</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
display:flex;
background:#f4f6fb;
}

.sidebar{

width:250px;
height:100vh;

background:#111827;

color:white;

padding:20px;

position:fixed;

left:0;

top:0;

}

.sidebar h2{

text-align:center;

margin-bottom:40px;

}

.sidebar a{

display:block;

padding:15px;

margin-bottom:10px;

text-decoration:none;

color:white;

border-radius:8px;

transition:.3s;

}

.sidebar a:hover{

background:#2563eb;

}

.main{

margin-left:250px;

padding:30px;

width:100%;

}

.cards{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:20px;

margin-bottom:30px;

}

.card{

background:white;

padding:20px;

border-radius:15px;

box-shadow:0 5px 15px rgba(0,0,0,.08);

}

.card h3{

font-size:18px;

margin-bottom:10px;

}

.card span{

font-size:30px;

font-weight:bold;

color:#2563eb;

}

.section{

background:white;

padding:25px;

border-radius:15px;

box-shadow:0 5px 15px rgba(0,0,0,.08);

margin-bottom:30px;

}

input,textarea{

width:100%;

padding:12px;

margin-top:10px;

margin-bottom:20px;

border:1px solid #ddd;

border-radius:8px;

}

button{

padding:12px 25px;

border:none;

background:#2563eb;

color:white;

border-radius:8px;

cursor:pointer;

font-size:16px;

}

button:hover{

background:#1d4ed8;

}

table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}

table th,table td{

padding:15px;

border-bottom:1px solid #eee;

text-align:left;

}

</style>

</head>

<body>
  
<div class="sidebar">

<h2>VTA SYSTEMS</h2>

<a href="#">🏠 Dashboard</a>

<a href="#">🛒 Sản phẩm</a>

<a href="#">📦 Đơn hàng</a>

<a href="#">👥 Khách hàng</a>

<a href="#">📊 Thống kê</a>

<a href="#">🚪 Đăng xuất</a>

</div>

<div class="main">

<h1>Dashboard</h1>

<br>

<div class="cards">

<div class="card">

<h3>Sản phẩm</h3>

<span id="productCount">0</span>

</div>

<div class="card">

<h3>Đơn hàng</h3>

<span id="orderCount">0</span>

</div>

<div class="card">

<h3>Khách hàng</h3>

<span id="customerCount">0</span>

</div>

<div class="card">

<h3>Doanh thu</h3>

<span id="revenue">0đ</span>

</div>

</div>

<div class="section">

    <h2>➕ Thêm sản phẩm</h2>

    <br>

    <label>Tên sản phẩm</label>
    <input
        type="text"
        id="productName"
        placeholder="Ví dụ: RAVEN X"
    >

    <label>Giá sản phẩm</label>
    <input
        type="number"
        id="productPrice"
        placeholder="Ví dụ: 2990000"
    >

    <label>Danh mục</label>
    <input
        type="text"
        id="productCategory"
        placeholder="Ví dụ: Loa Bluetooth"
    >

    <label>Số lượng tồn kho</label>
    <input
        type="number"
        id="productStock"
        placeholder="Ví dụ: 10"
    >

    <label>Mô tả sản phẩm</label>
    <textarea
        id="productDescription"
        rows="5"
        placeholder="Nhập mô tả sản phẩm..."
    ></textarea>

    <button id="addProductButton">
        ➕ THÊM SẢN PHẨM
    </button>

    <p id="productMessage" style="margin-top:15px;"></p>

</div>

<script type="module">

import { auth, database } from "./firebase.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    ref,
    get,
    push,
    set
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


// ===============================
// KIỂM TRA ĐĂNG NHẬP
// ===============================

// ===============================
// TÀI KHOẢN ADMIN DUY NHẤT
// ===============================

const ADMIN_EMAIL = "vtasystems.vn@gmail.com";


// ===============================
// KIỂM TRA QUYỀN ADMIN
// ===============================

onAuthStateChanged(auth, async (user) => {

    // Chưa đăng nhập
    if (!user) {

        window.location.href = "login.html";

        return;
    }


    // Đã đăng nhập nhưng không phải Admin
    if (user.email !== ADMIN_EMAIL) {

        alert("❌ Bạn không có quyền truy cập trang quản trị.");

        window.location.href = "index.html";

        return;
    }


    // Đúng tài khoản Admin
    console.log("👑 ADMIN:", user.email);

    loadDashboard();

});


// ===============================
// DASHBOARD
// ===============================

async function loadDashboard() {

    try {

        // -------------------------
        // ĐẾM SẢN PHẨM
        // -------------------------

        const productsSnapshot =
            await get(ref(database, "products"));

        let productCount = 0;

        if (productsSnapshot.exists()) {

            productCount =
                Object.keys(productsSnapshot.val()).length;

        }

        document.getElementById("productCount").textContent =
            productCount;


        // -------------------------
        // ĐẾM KHÁCH HÀNG
        // -------------------------

        const usersSnapshot =
            await get(ref(database, "users"));

        let customerCount = 0;

        if (usersSnapshot.exists()) {

            customerCount =
                Object.keys(usersSnapshot.val()).length;

        }

        document.getElementById("customerCount").textContent =
            customerCount;


        // -------------------------
        // ĐẾM ĐƠN HÀNG
        // -------------------------

        const ordersSnapshot =
            await get(ref(database, "orders"));

        let orderCount = 0;

        let revenue = 0;

        if (ordersSnapshot.exists()) {

            const orders =
                ordersSnapshot.val();

            orderCount =
                Object.keys(orders).length;


            // TÍNH DOANH THU

            Object.values(orders).forEach(order => {

                let total =
                    Number(order.total || 0);

                revenue += total;

            });

        }


        document.getElementById("orderCount").textContent =
            orderCount;


        // -------------------------
        // HIỂN THỊ DOANH THU
        // -------------------------

        document.getElementById("revenue").textContent =
            revenue.toLocaleString("vi-VN") + "đ";


    } catch (error) {

        console.error(
            "Không thể tải Dashboard:",
            error
        );

    }

}


// ===============================
// ĐĂNG XUẤT
// ===============================

const logoutButton =
    document.querySelector(".sidebar a:last-child");


logoutButton.addEventListener("click", async (event) => {

    event.preventDefault();

    try {

        await signOut(auth);

        window.location.href =
            "login.html";

    } catch (error) {

        console.error(
            "Lỗi đăng xuất:",
            error
        );

    }

});

// ===============================
// THÊM SẢN PHẨM
// ===============================

const addProductButton =
    document.getElementById("addProductButton");

const productMessage =
    document.getElementById("productMessage");


addProductButton.addEventListener("click", async () => {

    const name =
        document.getElementById("productName").value.trim();

    const price =
        Number(document.getElementById("productPrice").value);

    const category =
        document.getElementById("productCategory").value.trim();

    const stock =
        Number(document.getElementById("productStock").value);

    const description =
        document.getElementById("productDescription").value.trim();


    // Kiểm tra tên
    if (!name) {
        productMessage.textContent =
            "⚠️ Vui lòng nhập tên sản phẩm.";
        return;
    }


    // Kiểm tra giá
    if (!Number.isFinite(price) || price < 0) {
        productMessage.textContent =
            "⚠️ Giá sản phẩm không hợp lệ.";
        return;
    }


    // Kiểm tra danh mục
    if (!category) {
        productMessage.textContent =
            "⚠️ Vui lòng nhập danh mục.";
        return;
    }


    // Kiểm tra tồn kho
    if (!Number.isInteger(stock) || stock < 0) {
        productMessage.textContent =
            "⚠️ Số lượng tồn kho không hợp lệ.";
        return;
    }


    try {

        addProductButton.disabled = true;

        addProductButton.textContent =
            "ĐANG LƯU...";


        // Tạo ID tự động
        const newProductRef =
            push(ref(database, "products"));


        const product = {

            name: name,

            price: price,

            category: category,

            stock: stock,

            description: description,

            image: "",

            createdAt: Date.now()

        };


        // Lưu sản phẩm
        await set(
            newProductRef,
            product
        );


        productMessage.textContent =
            "✅ Thêm sản phẩm thành công!";


        // Xóa form
        document.getElementById("productName").value = "";

        document.getElementById("productPrice").value = "";

        document.getElementById("productCategory").value = "";

        document.getElementById("productStock").value = "";

        document.getElementById("productDescription").value = "";


        // Cập nhật số sản phẩm trên Dashboard
        loadDashboard();


    } catch (error) {

        console.error(
            "Lỗi thêm sản phẩm:",
            error
        );

        productMessage.textContent =
            "❌ Không thể thêm sản phẩm: " +
            error.message;


    } finally {

        addProductButton.disabled = false;

        addProductButton.textContent =
            "➕ THÊM SẢN PHẨM";

    }

});
  
</script>
  
</body>

</html>
