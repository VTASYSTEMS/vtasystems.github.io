<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Giỏ hàng | VTA SYSTEMS</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0b0b0b;
color:#fff;
}

header{
height:75px;
background:#111;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 40px;
border-bottom:2px solid #222;
}

.logo{
font-size:28px;
font-weight:bold;
}

.logo span{
color:#ff6600;
}

nav a{
color:white;
text-decoration:none;
margin-left:25px;
font-weight:bold;
}

nav a:hover{
color:#ff6600;
}

.container{
max-width:1200px;
margin:50px auto;
padding:20px;
}

h1{
text-align:center;
margin-bottom:40px;
}

h1 span{
color:#ff6600;
}

#cart-items{
display:flex;
flex-direction:column;
gap:20px;
}

.cart-item{
background:#151515;
border:1px solid #222;
border-radius:12px;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.left{
display:flex;
gap:20px;
align-items:center;
}

.left img{
width:130px;
height:130px;
object-fit:contain;
background:#090909;
border-radius:8px;
}

.info h2{
margin-bottom:10px;
}

.price{
color:#ff6600;
font-size:20px;
font-weight:bold;
}

.qty{
display:flex;
align-items:center;
gap:10px;
margin-top:15px;
}

.qty button{

width:35px;
height:35px;
border:none;
background:#ff6600;
color:white;
cursor:pointer;
font-size:18px;
border-radius:5px;

}

.remove{

background:#d63031;
padding:10px 15px;
border:none;
color:white;
cursor:pointer;
border-radius:6px;

}

.summary{

margin-top:40px;
background:#151515;
padding:25px;
border-radius:12px;

}

.row{

display:flex;
justify-content:space-between;
margin:15px 0;

}

.total{

font-size:26px;
font-weight:bold;
color:#ff6600;
border-top:1px solid #333;
padding-top:20px;

}

.buttons{

display:flex;
gap:20px;
margin-top:30px;

}

.buttons a,.buttons button{

flex:1;
padding:15px;
border:none;
border-radius:8px;
font-size:18px;
font-weight:bold;
cursor:pointer;
text-decoration:none;
text-align:center;

}

.back{

background:#444;
color:white;

}

.checkout{

background:#ff6600;
color:white;

}

.empty{

text-align:center;
padding:80px 20px;

}

footer{

margin-top:60px;
padding:25px;
text-align:center;
background:#111;

}

@media(max-width:768px){

.cart-item{

flex-direction:column;
align-items:flex-start;

}

.left{

flex-direction:column;

}

.left img{

width:100%;
height:220px;

}

.buttons{

flex-direction:column;

}

}

</style>

</head>

<body>

<header>

<div class="logo">

VTA <span><i class="fa-solid fa-bolt"></i></span> SYSTEMS

</div>

<nav>

<a href="index.html">Trang chủ</a>

<a href="cart.html">

<i class="fa-solid fa-cart-shopping"></i>

Giỏ hàng

</a>

</nav>

</header>

<div class="container">

<h1>GIỎ <span>HÀNG</span></h1>

<div id="cart-items">

</div>

<div class="summary">

<div class="row">

<span>Tạm tính</span>

<strong id="subtotal">0đ</strong>

</div>

<div class="row">

<span>Vận chuyển</span>

<strong>Miễn phí</strong>

</div>

<div class="row total">

<span>Tổng cộng</span>

<strong id="total">0đ</strong>

</div>

<input type="text" id="customerName" placeholder="Họ và tên"
style="width:100%;padding:12px;margin:10px 0;">

<input type="email" id="customerEmail" placeholder="Email"
style="width:100%;padding:12px;margin:10px 0;">

<input type="text" id="customerPhone" placeholder="Số điện thoại"
style="width:100%;padding:12px;margin:10px 0;">
  
<div class="buttons">

<a href="index.html" class="back">

Tiếp tục mua

</a>

<button class="checkout" onclick="checkout()">
Tiến hành thanh toán
</button>

</div>

</div>

</div>

<footer>
  
© 2026 VTA SYSTEMS

</footer>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="cart.js"></script>

</body>
</html>
